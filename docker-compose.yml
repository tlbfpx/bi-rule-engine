services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bi_rule_engine}
      MYSQL_USER: ${MYSQL_USER:-bi_rule}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bi_rule_pass}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-bi_rule}
      - DB_PASSWORD=${MYSQL_PASSWORD:-bi_rule_pass}
      - DB_NAME=${MYSQL_DATABASE:-bi_rule_engine}
      - REDIS_HOST=redis
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: ["./backend:/app"]

volumes:
  mysql_data:
  minio_data:
