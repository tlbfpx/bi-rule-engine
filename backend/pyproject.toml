[project]
name = "bi-rule-engine"
version = "1.0.0"
description = "BI 数据处理规则引擎 — 企业级数据转换平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "alembic>=1.14.0",
    "polars>=1.18.0",
    "numpy>=1.26.0",
    "lark>=1.2.0",
    "redis[hiredis]>=5.2.0",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    "fastexcel>=0.12.0",
    "cryptography>=44.0.0",
    "loguru>=0.7.0",
    "websockets>=13.0",
    "sqlparse>=0.5.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions", "__pycache__", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "B008",     # function call in default argument (FastAPI Depends pattern)
    "B904",     # raise from in except (too noisy for existing codebase)
    "RUF001",   # ambiguous unicode character in string (Chinese text)
    "RUF002",   # ambiguous unicode character in docstring (Chinese text)
    "RUF003",   # ambiguous unicode character in comment (Chinese text)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "scripts/", "tests/"]

[[tool.mypy.overrides]]
module = "app.engine.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.api.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.setuptools]
packages = {find = {where = ["."]}}
